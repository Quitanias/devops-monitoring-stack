apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-api-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Quitanias/devops-monitoring-stack.git'
    path: infra/k8s
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true